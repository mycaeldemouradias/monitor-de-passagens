name: Monitor de passagens

on:
  schedule:
    # A cada 2 horas, no minuto 17 (UTC). O GitHub pode atrasar alguns minutos em horários de pico.
    # O Google Flights roda com menos frequência: veja `google_flights_a_cada_horas` no config/rotas.yaml.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não notifica nem grava histórico)"
        type: boolean
        default: false
      fontes:
        description: "Só estas fontes (separadas por espaço; vazio = todas). Ex.: skiplagged"
        type: string
        default: ""

permissions:
  contents: write   # para salvar o histórico de preços de volta no repositório

concurrency:
  group: monitor-passagens
  cancel-in-progress: false

env:
  PYTHONPATH: src
  TZ: America/Recife
  # repositório público: os registros não mostram rotas, datas nem preços
  MONITOR_PRIVADO: "1"
  MONITOR_CHAVE: ${{ secrets.MONITOR_CHAVE }}

jobs:
  # O Skiplagged roda dividido em 6 computadores ao mesmo tempo (cada um com outro IP): todas as datas
  # em toda rodada (até 15 por computador = 90 datas). Se algum for bloqueado, a "repescagem" (mais 2
  # computadores, outros IPs) busca só as datas que ficaram faltando.
  skiplagged:
    if: ${{ !inputs.fontes || contains(inputs.fontes, 'skiplagged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # a mesma versão usada e testada no Mac
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens e estado, para o rodízio)
        run: python -m monitor.cofre abrir tudo
      - name: Buscar (parte ${{ matrix.parte }} de 6)
        run: python -m monitor --fontes skiplagged --parte ${{ matrix.parte }}/6 --salvar-ofertas parte-${{ matrix.parte }}.cripto
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: parte-${{ matrix.parte }}.cripto   # criptografado: artefatos são visíveis em repositório público
          retention-days: 1
          if-no-files-found: ignore

  repescagem:
    needs: skiplagged
    if: ${{ always() && (!inputs.fontes || contains(inputs.fontes, 'skiplagged')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens e estado, para o rodízio)
        run: python -m monitor.cofre abrir tudo
      - name: Baixar as partes já feitas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parte-*
          path: feitas
          merge-multiple: true
      - name: Buscar o que ficou faltando (parte ${{ matrix.parte }} de 2)
        run: |
          mkdir -p feitas
          python -m monitor --fontes skiplagged --so-faltantes feitas --parte ${{ matrix.parte }}/2 --salvar-ofertas repescagem-${{ matrix.parte }}.cripto
      - uses: actions/upload-artifact@v4
        with:
          name: parte-r${{ matrix.parte }}
          path: repescagem-${{ matrix.parte }}.cripto
          retention-days: 1
          if-no-files-found: ignore

  monitorar:
    needs: [skiplagged, repescagem]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # a mesma versão usada e testada no Mac
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Abrir o cofre (viagens e histórico criptografados)
        run: python -m monitor.cofre abrir tudo

      - name: Instalar Chromium (só se alguma rota usa sites de cias/agências)
        run: |
          if python -m monitor --precisa-navegador; then
            python -m playwright install --with-deps chromium
          else
            echo "Nenhuma rota ativa usa navegador — pulando."
          fi

      - name: Baixar as partes do Skiplagged
        uses: actions/download-artifact@v4
        continue-on-error: true   # rodada sem Skiplagged (ex.: só Google) não tem partes
        with:
          pattern: parte-*
          path: partes
          merge-multiple: true

      - name: Buscar preços (outras fontes) e juntar tudo
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FONTES: ${{ inputs.fontes }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          args="--excluir-fontes skiplagged"
          if [ -n "$FONTES" ]; then
            resto=$(echo "$FONTES" | tr ' ' '\n' | grep -v '^skiplagged$' | grep -v '^$' | tr '\n' ' ' || true)
            args="$args --fontes ${resto:-nenhuma}"
          fi
          partes=$(ls partes/*.cripto 2>/dev/null || true)
          [ -n "$partes" ] && args="$args --incluir-ofertas $partes"
          [ "$SIMULAR" = "true" ] && args="$args --simular"
          python -m monitor $args

      - name: Salvar histórico no repositório (criptografado)
        if: always() && inputs.simular != true
        run: |
          python -m monitor.cofre fechar dados
          git config user.name "monitor-passagens[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # só os .cripto entram: as versões legíveis estão no .gitignore
          git add data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: execução $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

  # Página com senha (GitHub Pages): preços, roteiros e calendário para ver de qualquer lugar.
  # O conteúdo vai criptografado (AES-256); só abre com a PAGINA_SENHA. Só para ver.
  pagina:
    needs: monitorar
    if: ${{ always() && inputs.simular != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # já com os preços que a rodada acabou de salvar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre
        run: python -m monitor.cofre abrir tudo
      - name: Montar a página (trancada com senha)
        env:
          PAGINA_SENHA: ${{ secrets.PAGINA_SENHA }}
        run: python -m monitor.pagina "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: publicar
        uses: actions/deploy-pages@v4
