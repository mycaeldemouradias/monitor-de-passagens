name: Monitor de passagens

on:
  schedule:
    # A cada 2 horas, no minuto 17 (UTC). O GitHub pode atrasar alguns minutos em horários de pico.
    # O Google Flights roda com menos frequência: veja `google_flights_a_cada_horas` no config/rotas.yaml.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não notifica nem grava histórico)"
        type: boolean
        default: false
      fontes:
        description: "Só estas fontes (separadas por espaço; vazio = todas). Ex.: skiplagged · hospedagem = só buscar hospedagem agora"
        type: string
        default: ""

permissions:
  contents: write   # para salvar o histórico de preços de volta no repositório

concurrency:
  group: monitor-passagens
  cancel-in-progress: false

env:
  PYTHONPATH: src
  TZ: America/Recife
  # repositório público: os registros não mostram rotas, datas nem preços
  MONITOR_PRIVADO: "1"
  MONITOR_CHAVE: ${{ secrets.MONITOR_CHAVE }}

jobs:
  # O MCP do Skiplagged respondeu HTTP 429 em rajadas maiores. Usamos até 8 consultas por parte e
  # 3 workers ao mesmo tempo; as partes restantes ficam na fila e seguem automaticamente.
  planejar:
    if: ${{ !inputs.fontes || contains(inputs.fontes, 'skiplagged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      n: ${{ steps.conta.outputs.n }}
      partes: ${{ steps.conta.outputs.partes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens)
        run: python -m monitor.cofre abrir config
      - name: Contar as datas
        id: conta
        run: |
          total=$(python -m monitor --fontes skiplagged --listar | sed -n 's/^\[skiplagged\] \([0-9]*\) busca.*/\1/p')
          n=$(( (${total:-0} + 7) / 8 )); [ "$n" -lt 2 ] && n=2; [ "$n" -gt 256 ] && n=256
          echo "Skiplagged: ${total:-0} busca(s) em $n partes, até 3 workers simultâneos."
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "partes=[$(seq 1 $n | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  # O Skiplagged roda dividido em vários computadores ao mesmo tempo (cada um com outro IP). Se algum for
  # bloqueado, a "repescagem" (mais computadores, outros IPs) busca só as datas que ficaram faltando; e o que
  # ainda faltar depois dela vai para uma 2ª repescagem.
  skiplagged:
    needs: planejar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3   # ritmo controlado para evitar HTTP 429 no MCP do Skiplagged
      matrix:
        parte: ${{ fromJSON(needs.planejar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # a mesma versão usada e testada no Mac
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens e estado, para o rodízio)
        run: python -m monitor.cofre abrir tudo
      - name: Buscar (parte ${{ matrix.parte }} de ${{ needs.planejar.outputs.n }})
        run: python -m monitor --fontes skiplagged --parte ${{ matrix.parte }}/${{ needs.planejar.outputs.n }} --salvar-ofertas parte-${{ matrix.parte }}.cripto
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: parte-${{ matrix.parte }}.cripto   # criptografado: artefatos são visíveis em repositório público
          retention-days: 1
          if-no-files-found: ignore

  repescagem:
    needs: skiplagged
    if: ${{ always() && (!inputs.fontes || contains(inputs.fontes, 'skiplagged')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens e estado, para o rodízio)
        run: python -m monitor.cofre abrir tudo
      - name: Baixar as partes já feitas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parte-*
          path: feitas
          merge-multiple: true
      - name: Buscar o que ficou faltando (parte ${{ matrix.parte }} de 3)
        run: |
          mkdir -p feitas
          python -m monitor --fontes skiplagged --so-faltantes feitas --parte ${{ matrix.parte }}/3 --max-por-fonte 1000 --salvar-ofertas repescagem-${{ matrix.parte }}.cripto
      - uses: actions/upload-artifact@v4
        with:
          name: parte-r${{ matrix.parte }}
          path: repescagem-${{ matrix.parte }}.cripto
          retention-days: 1
          if-no-files-found: ignore

  # 2ª repescagem: o que ainda faltou depois da 1ª (outros 3 computadores, outros IPs)
  repescagem2:
    needs: repescagem
    if: ${{ always() && (!inputs.fontes || contains(inputs.fontes, 'skiplagged')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre (viagens e estado, para o rodízio)
        run: python -m monitor.cofre abrir tudo
      - name: Baixar as partes já feitas (incluindo a 1ª repescagem)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parte-*
          path: feitas
          merge-multiple: true
      - name: Buscar o que ainda falta (parte ${{ matrix.parte }} de 3)
        run: |
          mkdir -p feitas
          python -m monitor --fontes skiplagged --so-faltantes feitas --parte ${{ matrix.parte }}/3 --max-por-fonte 1000 --salvar-ofertas repescagem2-${{ matrix.parte }}.cripto
      - uses: actions/upload-artifact@v4
        with:
          name: parte-s${{ matrix.parte }}
          path: repescagem2-${{ matrix.parte }}.cripto
          retention-days: 1
          if-no-files-found: ignore

  monitorar:
    needs: [skiplagged, repescagem, repescagem2]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a versão mais nova (a rodada pode ter esperado outra terminar)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # a mesma versão usada e testada no Mac
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Abrir o cofre (viagens e histórico criptografados)
        run: python -m monitor.cofre abrir tudo

      - name: Instalar Chromium (só se alguma rota usa sites de cias/agências)
        run: |
          if python -m monitor --precisa-navegador; then
            python -m playwright install --with-deps chromium
          else
            echo "Nenhuma rota ativa usa navegador — pulando."
          fi

      - name: Baixar as partes do Skiplagged
        uses: actions/download-artifact@v4
        continue-on-error: true   # rodada sem Skiplagged (ex.: só Google) não tem partes
        with:
          pattern: parte-*
          path: partes
          merge-multiple: true

      - name: Buscar preços (outras fontes) e juntar tudo
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FONTES: ${{ inputs.fontes }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          args="--excluir-fontes skiplagged"
          if [ -n "$FONTES" ]; then
            resto=$(echo "$FONTES" | tr ' ' '\n' | grep -v '^skiplagged$' | grep -v '^$' | tr '\n' ' ' || true)
            args="$args --fontes ${resto:-nenhuma}"
          fi
          partes=$(ls partes/*.cripto 2>/dev/null || true)
          [ -n "$partes" ] && args="$args --incluir-ofertas $partes"
          [ "$SIMULAR" = "true" ] && args="$args --simular"
          python -m monitor $args

      - name: Salvar histórico no repositório (criptografado)
        if: always() && inputs.simular != true
        run: |
          python -m monitor.cofre fechar dados
          git config user.name "monitor-passagens[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # só os .cripto entram: as versões legíveis estão no .gitignore
          git add data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: execução $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

  # Hospedagem (Airbnb): preço dos seus links para as noites dos roteiros mais baratos. A cada 12h
  # (o preço de hospedagem muda menos; e menos visitas = menos risco de bloqueio).
  hospedagem:
    needs: monitorar
    if: ${{ always() && inputs.simular != true && (!inputs.fontes || contains(inputs.fontes, 'hospedagem')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # já com os voos que a rodada acabou de salvar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre
        run: python -m monitor.cofre abrir tudo
      - name: Está na hora?
        id: hora
        run: |
          if [ "$FONTES" = "hospedagem" ] || python -m monitor.hospedagem --precisa; then
            echo "buscar=sim" >> "$GITHUB_OUTPUT"
          fi
        env:
          FONTES: ${{ inputs.fontes }}
      - name: Instalar Chromium
        if: steps.hora.outputs.buscar == 'sim'
        run: python -m playwright install --with-deps chromium
      - name: Buscar hospedagem
        if: steps.hora.outputs.buscar == 'sim'
        run: python -m monitor.hospedagem --a-cada ${{ inputs.fontes == 'hospedagem' && '0' || '12' }}
      - name: Salvar (criptografado)
        if: steps.hora.outputs.buscar == 'sim'
        run: |
          python -m monitor.cofre fechar dados
          git config user.name "monitor-passagens[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "hospedagem: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

  # Página com senha (GitHub Pages): preços, roteiros e calendário para ver de qualquer lugar.
  # O conteúdo vai criptografado (AES-256); só abre com a PAGINA_SENHA. Só para ver.
  pagina:
    needs: [monitorar, hospedagem]
    if: ${{ always() && inputs.simular != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # o deploy-pages procura a página enviada no passo anterior
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # já com os preços que a rodada acabou de salvar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Abrir o cofre
        run: python -m monitor.cofre abrir tudo
      - name: Montar a página (trancada com senha)
        env:
          PAGINA_SENHA: ${{ secrets.PAGINA_SENHA }}
        run: python -m monitor.pagina "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Esperar o GitHub registrar a página
        run: sleep 15   # em 22/11/2026 o deploy procurou a página 0,4 s depois do envio e não achou
      - id: publicar
        uses: actions/deploy-pages@v4

  # chama o relógio, que espera completar 2h desde o início desta busca e dispara a próxima
  proxima:
    needs: pagina
    if: ${{ always() && inputs.simular != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Agendar a próxima busca
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          inicio=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          gh workflow run relogio.yml -f inicio="$inicio"
          echo "Relógio ligado: próxima busca 2h depois de $inicio."
